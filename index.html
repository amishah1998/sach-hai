<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7a2e0e">
<title>सच है? · Sach Hai?</title>
<meta name="description" content="Free, simple checker for WhatsApp forwards in 9 Indian languages. Paste a message or upload a screenshot.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%8D%3C/text%3E%3C/svg%3E">
<style>
/* ======================================================================
   सच है? / Sach Hai? — single file, no backend, no tracking.
   ====================================================================== */
:root{
  --bg:#fffaf2; --ink:#1a1a1a; --muted:#3d3d3d; --brand:#7a2e0e; --brand2:#b5470f;
  --card:#ffffff; --line:#2b2b2b;
  --fake:#b00020; --fakebg:#ffe8ea; --real:#0b6b2b; --realbg:#e3f6e8; --unsure:#7a5200; --unsurebg:#fff4d6;
}
*{box-sizing:border-box}
html{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Gurmukhi","Noto Sans Bengali","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Gujarati","Noto Sans Kannada","Nirmala UI","Mangal","Vrinda","Latha","Gautami","Shruti","Tunga","Raavi","Kohinoor Devanagari","Tamil Sangam MN",sans-serif;
  font-size:1.1rem;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
h1{font-size:2rem;margin:0;color:var(--brand);line-height:1.1}
h1 small{display:block;font-size:1rem;color:var(--muted);font-weight:600}
.tagline{font-size:1.15rem;margin:6px 0 16px;color:var(--muted)}
button,.btn{font:inherit;font-size:1.15rem;font-weight:700;border-radius:14px;cursor:pointer;
  min-height:60px;padding:12px 18px;border:3px solid var(--line);background:#fff;color:var(--ink);
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;text-align:center}
button:focus-visible,textarea:focus-visible,input:focus-visible,.btn:focus-within{outline:4px solid #1f5fd6;outline-offset:3px}
.lang{width:auto;min-height:52px;font-size:1.05rem;padding:8px 14px;background:var(--brand);color:#fff;border-color:var(--brand)}
label.big{display:block;font-weight:800;font-size:1.2rem;margin:10px 0 6px}
textarea{width:100%;min-height:180px;font:inherit;font-size:1.2rem;padding:14px;border:3px solid var(--line);
  border-radius:14px;background:#fff;color:var(--ink);resize:vertical}
.row{display:grid;gap:12px;margin-top:12px}
.upload{background:#fff;border-style:dashed}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.check{background:var(--brand);border-color:var(--brand);color:#fff;font-size:1.4rem;min-height:72px}
.check:disabled{opacity:.6}
.ghost{background:transparent;border-width:2px;min-height:54px;font-size:1.05rem}
#preview{max-width:100%;max-height:220px;border-radius:12px;border:2px solid #ccc;display:none;margin-top:10px}
.progress{margin-top:12px;display:none}
.bar{height:20px;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.bar>div{height:100%;width:0;background:var(--brand2);transition:width .2s}
.status{font-size:1.05rem;margin-top:6px;color:var(--muted)}
#result{margin-top:20px;display:none;border:4px solid;border-radius:18px;padding:18px;background:var(--card)}
#result.fake{border-color:var(--fake);background:var(--fakebg)}
#result.real{border-color:var(--real);background:var(--realbg)}
#result.unsure{border-color:var(--unsure);background:var(--unsurebg)}
.verdict{display:flex;align-items:center;gap:14px;font-size:1.9rem;font-weight:900;line-height:1.2}
.verdict .icon{font-size:3.4rem;line-height:1}
.fake .verdict{color:var(--fake)} .real .verdict{color:var(--real)} .unsure .verdict{color:var(--unsure)}
.reasons{margin:12px 0 4px;padding-left:1.2em;font-size:1.15rem}
.reasons li{margin:6px 0}
.sources{margin:10px 0;font-size:1.05rem}
.sources a{color:#0b3fa8;font-weight:700;word-break:break-word}
.tiplines{background:#fff;border:2px solid var(--unsure);border-radius:12px;padding:10px 14px;margin:12px 0}
.tiplines h3{margin:0 0 6px;font-size:1.15rem}
.tiplines ul{margin:0;padding-left:1.1em}
.tiplines a{color:#0b3fa8;font-weight:700;white-space:nowrap}
.actions{display:grid;gap:12px;margin-top:14px}
.wa{background:#128c3e;border-color:#0d6b2f;color:#fff}
.speak{background:#fff}
.disclaimer{margin-top:28px;font-size:1rem;color:var(--muted);border-top:2px solid #ddd;padding-top:12px}
/* settings drawer */
#drawer{position:fixed;inset:auto 0 0 0;background:#fff;border-top:4px solid var(--brand);border-radius:20px 20px 0 0;
  padding:18px 16px 24px;max-height:85vh;overflow:auto;transform:translateY(110%);transition:transform .25s,visibility .25s;visibility:hidden;z-index:10;
  box-shadow:0 -8px 30px rgba(0,0,0,.25)}
#drawer.open{transform:none;visibility:visible}
#drawer .inner{max-width:640px;margin:0 auto}
#drawer h2{margin:0 0 8px;font-size:1.4rem}
#drawer input{width:100%;font:inherit;font-size:1.05rem;padding:12px;border:3px solid var(--line);border-radius:12px}
#drawer p{font-size:1rem}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:9}
#shade.open{display:block}
.small{font-size:1rem}
.sr{position:absolute;left:-9999px}
#result.none{border-color:#3d4f7a;background:#eaf0fb}
.none .verdict{color:#2b3d66}
.langgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.langgrid button{min-height:64px;font-size:1.3rem}
.langgrid button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
#langModal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-end;justify-content:center}
#langModal.open{display:flex}
#langModal .box{background:#fff;border-radius:20px 20px 0 0;padding:18px 16px 24px;width:100%;max-width:640px;max-height:90vh;overflow:auto}
#langModal h2{margin:0 0 6px;font-size:1.4rem}
.checkstatus{font-size:1.05rem;color:var(--muted);min-height:1.4em;text-align:center}
.sources a{display:block;margin:6px 0}
.note{font-size:1rem;color:var(--muted);margin-top:8px}

h1,.verdict,button,.btn,.reasons li,.tagline,label.big{overflow-wrap:break-word;word-break:normal}
.verdict span:last-child{min-width:0}
.lang{white-space:nowrap}
html:is([lang=ta],[lang=te],[lang=kn],[lang=bn],[lang=pa],[lang=gu],[lang=mr]) .verdict{font-size:1.5rem}
html:is([lang=ta],[lang=te],[lang=kn]) .check{font-size:1.25rem}
</style>
</head>
<body>
<main>
  <header>
    <h1>सच है?<small id="t_sub"></small></h1>
    <button class="lang" id="langBtn" type="button">🌐 <span id="t_langBtn"></span></button>
  </header>
  <p class="tagline" id="t_tagline"></p>

  <label class="big" for="msg" id="t_label"></label>
  <textarea id="msg" dir="auto" autocomplete="off" spellcheck="false"></textarea>

  <div class="row">
    <label class="btn upload" id="uploadLbl">
      <span aria-hidden="true">📷</span> <span id="t_upload"></span>
      <input type="file" id="file" accept="image/*,.heic,.heif">
    </label>
    <img id="preview" alt="">
    <div class="progress" id="progress" role="status" aria-live="polite">
      <div class="bar"><div id="barFill"></div></div>
      <div class="status" id="progressText"></div>
    </div>
    <button class="check" id="checkBtn" type="button"><span aria-hidden="true">🔍</span> <span id="t_check"></span></button>
    <div class="checkstatus" id="checkStatus" aria-live="polite"></div>
  </div>

  <section id="result" aria-live="polite">
    <div class="verdict"><span class="icon" id="vIcon"></span><span id="vText"></span></div>
    <ul class="reasons" id="reasons"></ul>
    <div class="sources" id="sources"></div>
    <div class="tiplines" id="tiplines" hidden>
      <h3 id="t_tipTitle"></h3>
      <ul id="tipList"></ul>
    </div>
    <div class="actions">
      <button class="wa" id="waBtn" type="button"><span aria-hidden="true">📤</span> <span id="t_wa"></span></button>
      <button class="speak" id="speakBtn" type="button"><span aria-hidden="true">🔊</span> <span id="t_speak"></span></button>
      <div class="note" id="voiceNote" hidden></div>
      <button class="ghost" id="clearBtn" type="button"><span id="t_newc"></span></button>
    </div>
  </section>

  <div class="row" style="margin-top:24px">
    <button class="ghost" id="settingsBtn" type="button"><span aria-hidden="true">⚙️</span> <span id="t_settings"></span></button>
  </div>
  <p class="disclaimer" id="t_disclaimer"></p>
</main>

<div id="langModal" role="dialog" aria-modal="true">
  <div class="box">
    <h2 id="t_langTitle"></h2>
    <div class="langgrid" id="langGrid"></div>
  </div>
</div>

<div id="shade"></div>
<aside id="drawer" aria-hidden="true">
  <div class="inner">
    <h2 id="t_setTitle"></h2>
    <p id="t_setHelp"></p>
    <label class="big" for="gemKey" id="t_keyLabel"></label>
    <input id="gemKey" type="password" autocomplete="off">
    <div class="row">
      <button class="check" id="saveKey" type="button"><span id="t_save"></span></button>
      <button class="ghost" id="clearKey" type="button"><span id="t_clearKey"></span></button>
      <button class="ghost" id="closeDrawer" type="button"><span id="t_close"></span></button>
    </div>
    <p class="small" id="keyStatus"></p>
  </div>
</div>

<script>

const KIND_ORDER = {strong:0, lure:1, ask:2, hint:3};

/* score >= 3: fake without asking the AI. 2: a scam story or a bad link/fee alone, so never "real". 1: weak hint. */
function ruleCheck(text){
  const t = (text||"").normalize("NFC");
  const hits = new Map();
  const flat = t.replace(/\s*\n\s*/g, " ");                 // photo text breaks one claim over several lines
  const tn = stripNegated(t), fn = stripNegated(flat);
  for(const r of RULES) if(!hits.has(r.id) && (r.re.test(r.neg ? tn : t) || r.re.test(r.neg ? fn : flat))) hits.set(r.id, r);
  const hit = [...hits.values()];
  const has = k => hit.some(r=>r.kind===k);
  const askW = Math.max(0, ...hit.filter(r=>r.kind==="ask").map(r=>r.w||1));
  let score = has("strong") || (has("lure") && has("ask")) ? 3 : Math.max(has("lure") ? 2 : 0, askW, has("hint") ? 1 : 0);
  if(score < 3 && askW >= 2 && hit.filter(r=>r.kind==="ask").length >= 2) score = 3;   // odd link + fee/call
  const ids = hit.sort((a,b)=>KIND_ORDER[a.kind]-KIND_ORDER[b.kind] || (b.w||1)-(a.w||1)).map(r=>r.id);
  return {score, ids};
}

function loadScript(src){

    if(window.Tesseract) return res();
    const s=document.createElement("script"); s.src=src; s.async=true; s.integrity=TESSERACT_SRI; s.crossOrigin="anonymous"; s.onload=res; s.onerror=()=>rej(new Error("load"));

function setProgress(pct, text){

  $("barFill").style.width = Math.round(Math.max(0,Math.min(1,pct))*100)+"%";

let worker = null, workerLangs = "", onOcrProgress = ()=>{};
function ocrLangs(){ return [...new Set(["eng","hin",LANGS[lang].ocr])].join("+"); }
async function getWorker(){
  const want = ocrLangs();
  if(worker && workerLangs===want) return worker;
  await loadScript(TESSERACT_CDN);
  if(worker){ try{ await worker.terminate(); }catch(e){} worker=null; }
  worker = await Tesseract.createWorker(want.split("+"), 1, {logger: m => onOcrProgress(m)}); // one reusable worker
  workerLangs = want; return worker;
}
async function decodeImage(file){
  try{ return await createImageBitmap(file, {imageOrientation:"from-image"}); }catch(e){}

/* Fit the long side into [minSide, maxSide]: big phone screenshots get smaller (fast), tiny images get bigger (readable). */
function toCanvas(img, maxSide, minSide){
  const w=img.width, h=img.height, long=Math.max(w,h);
  let k = Math.min(1, maxSide/long); if(long*k < minSide) k = Math.min(3, minSide/long);
  const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k));
  const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
  return c;
}
function fileToB64(file){ return new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>{const s=String(fr.result); res(s.slice(s.indexOf(",")+1));}; fr.readAsDataURL(file); }); }
const GEMINI_IMG_TYPES = /^image\/(jpeg|png|webp|heic|heif)$/;

async function handleImage(file){
  const job = ++ocrJob;
  stopSpeak(); lastResult=null; $("result").style.display="none"; $("checkStatus").textContent="";
  if($("msg").value.trim() === filledFromOcr) $("msg").value = "";   // a new photo replaces text read from the old one
  ocrText=""; filledFromOcr=""; imageData=null;
  const img=$("preview"); img.src=URL.createObjectURL(file); img.style.display="block";
  ocrBusy = true; $("checkBtn").disabled = true;
  setProgress(0.02, L().ocrLoad);
  try{
    let bmp;
    try{ bmp = await decodeImage(file); }
    catch(e){ // e.g. HEIC on Chrome: can't read words here, but Gemini can look at the original
      if(GEMINI_IMG_TYPES.test(file.type||"") && file.size < 15e6) imageData = {mime:file.type, b64: await fileToB64(file)};
      if(job===ocrJob) setProgress(0, imageData && hasKey() ? L().heicAI : L().heicNoAI);
      return;
    }
    const send = toCanvas(bmp, 1536, 0);                       // what Gemini sees: ≤1536 px JPEG
    imageData = {mime:"image/jpeg", b64: send.toDataURL("image/jpeg", 0.85).split(",")[1]};
    const ocrCanvas = toCanvas(bmp, 2000, 1400);              // what OCR reads
    onOcrProgress = m => {
      if(job!==ocrJob) return;
      if(m.status==="recognizing text") setProgress(0.3+0.7*m.progress, L().ocrRead+" "+Math.round(m.progress*100)+"%");
      else if(typeof m.progress==="number") setProgress(0.05+0.25*m.progress, L().ocrLoad);
    };
    const w = await getWorker();
    if(job!==ocrJob) return;
    const {data} = await w.recognize(ocrCanvas);
    if(job!==ocrJob) return;                                   // a newer photo was chosen meanwhile
    const text = (data.text||"").replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
    const letters = (text.match(/\p{L}/gu)||[]).length;
    if(letters < 8 || (data.confidence||0) < 40){              // nothing readable / junk
      setProgress(1, hasKey() ? L().ocrNoTextAI : L().ocrNoTextNoAI);
    }else{
      ocrText = text; setProgress(1, L().ocrDone);
      if(!$("msg").value.trim()){ $("msg").value = text; filledFromOcr = text; }
    }
  }catch(e){
    if(job===ocrJob) setProgress(0, imageData && hasKey() ? L().ocrNoTextAI : L().ocrFail);
  }finally{
    if(job===ocrJob){ ocrBusy=false; $("checkBtn").disabled=false; }
  }
}

function aiErr(code,msg){ const e=new Error(msg||code); e.code=code; return e; }
function geminiUrl(model){ return `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`; }
function parseGemini(j, model){
  const txt = (((j.candidates||[])[0]||{}).content||{}).parts?.filter(p=>!p.thought).map(p=>p.text||"").join("") || "";
  const o = JSON.parse(txt.replace(/^\s*```(json)?/,"").replace(/```\s*$/,"").trim());
  o.model = j.modelVersion || model;
  return o;
}
function throwGeminiHttp(r, t){
  if((r.status===400 && /api key/i.test(t)) || r.status===401 || r.status===403){ const e=aiErr("aiKey"); e.fatal=true; throw e; }
  throw aiErr(r.status===429 ? "aiRate" : r.status>=500 ? "aiBusy" : "aiErr");
}
function isLiteModel(name){ return /lite/i.test(String(name||"")); }
function nextStronger(model){
  const name = String(model||"");
  const i = GEMINI_MODELS.findIndex(m => name===m || name.startsWith(m));
  for(let j=(i<0?0:i+1); j<GEMINI_MODELS.length; j++) if(!isLiteModel(GEMINI_MODELS[j])) return GEMINI_MODELS[j];
  return null;
}
/* Single-model call, used for a one-step escalate after Flash-Lite says "unsure". */
function callGeminiOne(body, model){
  const key = getKey(), ctl=new AbortController(), kill=setTimeout(()=>ctl.abort(), MODEL_TIMEOUT_MS);
  return fetch(geminiUrl(model), {method:"POST", headers:{"Content-Type":"application/json","x-goog-api-key":key}, body, signal:ctl.signal})
    .then(async r=>{
      if(!r.ok){ throwGeminiHttp(r, await r.text().catch(()=> "")); }
      const o = parseGemini(await r.json(), model);
      localStorage.setItem(LS_MODEL, model);
      return o;
    })
    .finally(()=>clearTimeout(kill));
}
/* If a lite model came back "unsure", ask the next stronger model once. Keep the first answer on quota/outage. */
async function maybeEscalate(body, o){
  if(!o || o.verdict!=="unsure") return o;
  const next = nextStronger(o.model);
  if(!next) return o;
  try{
    const o2 = await callGeminiOne(body, next);
    if(o2 && o2.verdict){ o2.escalatedFrom = o.model; return o2; }
  }catch(e){ if(e && e.fatal) throw e; }
  return o;
}
/* Hedged race: start the most reliable model; if it hasn't answered in HEDGE_MS (or fails), start the next one too.
   First good answer wins, the rest are cancelled. */
function callGemini(body){
  const key = getKey();
  const sticky = localStorage.getItem(LS_MODEL);
  const order = sticky && GEMINI_MODELS.includes(sticky) ? [sticky, ...GEMINI_MODELS.filter(m=>m!==sticky)] : GEMINI_MODELS.slice();
  return new Promise((resolve,reject)=>{
    let next=0, active=0, done=false, lastErr=null; const ctrls=[];
    const finish = (err,val) => { if(done) return; done=true; ctrls.forEach(c=>c.abort()); err?reject(err):resolve(val); };
    const launch = () => {
      if(done) return;
      if(next>=order.length){ if(!active) finish(lastErr||aiErr("aiErr")); return; }
      const model=order[next++], ctl=new AbortController(); ctrls.push(ctl); active++;
      const hedge=setTimeout(launch, HEDGE_MS), kill=setTimeout(()=>ctl.abort(), MODEL_TIMEOUT_MS);
      fetch(geminiUrl(model),
        {method:"POST", headers:{"Content-Type":"application/json","x-goog-api-key":key}, body, signal:ctl.signal})
      .then(async r=>{
        if(!r.ok){ throwGeminiHttp(r, await r.text().catch(()=> "")); }
        const o = parseGemini(await r.json(), model);
        localStorage.setItem(LS_MODEL, model);
        finish(null, o);
      })
      .catch(e=>{
        if(done) return;
        if(e && e.fatal) return finish(e);
        if(!lastErr || lastErr.code!=="aiRate") lastErr = e && e.code ? e : aiErr(e && e.name==="AbortError" ? "aiBusy" : "aiErr");
      })
      .finally(()=>{ clearTimeout(kill); active--; if(!done){ clearTimeout(hedge); launch(); } });
    };
    launch();
  });
}
const VERDICTS = ["real","fake","unsure","no_claim"];
function schema(extra){
  const p = {verdict:{type:"STRING",enum:VERDICTS}, reason_en:{type:"STRING"}, reason_hi:{type:"STRING"}, reason_local:{type:"STRING"}};
  Object.assign(p, extra||{});
  return {type:"OBJECT", properties:p, required:["verdict","reason_en","reason_hi","reason_local"]};
}
function common(langName){ return `Today's date is ${new Date().toISOString().slice(0,10)}.
Never give medical or legal advice; for health claims say to ask a doctor, and never call a remedy safe or effective. Never invent sources, URLs, dates or numbers. Never say that fact-checkers or officials confirmed or denied something unless such an article is given to you below. Do not repeat phone numbers or links from the message.
Write reasons for an elderly reader: 1-2 short, simple, polite sentences that say WHY. reason_en: simple English. reason_hi: simple Hindi (Devanagari). reason_local: simple ${langName} (if ${langName} is English or Hindi, repeat that text).`; }
const VERDICT_RULES = `Choose exactly one verdict. Be decisive: elderly readers need a clear yes or no, not "maybe". Use your world knowledge confidently.
- "no_claim": greetings, wishes, prayers, jokes, quotes, personal or family chat, or anything with no news claim, offer or request worth checking.
- "fake": a scam (KYC/bank account block, lottery/KBC prize, electricity cut tonight, digital arrest/CBI/police video call, OTP/PIN request, fake job or government scheme, phishing link or app) OR the main claim is false, misleading, edited, AI-made, or old news recycled as new OR the claim is implausible, sensational, or contradicts well-established facts OR it is a fear-mongering health or doomsday statistic OR it falsely attributes something to WHO, RBI, the government, NASA, the UN, or a similar official body OR it is an "X% of people will get Y disease by year" style prediction, viral "breaking" panic, or a miracle cure. If an extraordinary claim has no solid evidence, treat it as fake — missing evidence is not a reason for "unsure".
- "real": ONLY for well-established facts you are highly confident are true (widely known geography, settled history, or a clearly confirmed official fact).
- "unsure": ONLY when the claim is genuinely plausible but cannot be verified — for example a specific local event, a very recent incident, or a narrow claim you cannot confirm or deny. Do not use "unsure" for sensational statistics, official-sounding health or doomsday warnings, or shocking "WHO/RBI/NASA/the government said" claims.`;
function partsFor(prompt){
  const parts=[{text:prompt}];
  if(imageData) parts.push({inline_data:{mime_type:imageData.mime, data:imageData.b64}});
  return parts;
}
function msgBlock(text, fromOcr){
  let note = "";
  if(imageData && !text) note = "The message is the attached image (no readable text). Judge the image itself.\n";
  else if(imageData && fromOcr) note = "The text below was read from the attached image by OCR and may contain mistakes; if they differ, trust the image.\n";
  else if(imageData) note = "An image was also attached; consider it together with the text.\n";
  return note + 'Message:\n"""' + (text||"(no text)").slice(0,4000) + '"""';
}
async function aiCheck(text, fromOcr){
  const langName = LANGS[lang].ai;
  const prompt = `You are a decisive fact-checking helper for elderly people in India who receive WhatsApp forwards. Prefer a clear fake or real over an uncertain maybe. ${common(langName)}
${VERDICT_RULES}
Also give "search_queries": exactly 2 English keyword searches that would find a fact-check article about the main claim: the first 3-4 distinctive words (e.g. "new 1000 rupee note"), the second only the 2 most distinctive words (e.g. "1000 note"). No words like "fact check", "fake", "viral", "news". Empty list for no_claim or obvious scams.
Reply ONLY with the JSON object.
${msgBlock(text, fromOcr)}`;
  const body = JSON.stringify({contents:[{role:"user",parts:partsFor(prompt)}],
    generationConfig:{temperature:0.1, responseMimeType:"application/json",
      responseSchema: schema({search_queries:{type:"ARRAY",items:{type:"STRING"}}})}});
  return maybeEscalate(body, await callGemini(body));
}
async function aiRecheck(text, fromOcr, arts){
  const langName = LANGS[lang].ai;
  const list = arts.map((a,i)=>`[${i+1}] ${a.title} — ${a.site}, ${a.date}. ${a.excerpt}`).join("\n");
  const prompt = `You are a decisive fact-checking helper for elderly people in India who receive WhatsApp forwards. Prefer a clear fake or real over an uncertain maybe. ${common(langName)}
We searched Indian fact-check websites and found these articles (number, title, site, date, excerpt):
${list}
First decide which articles check this EXACT claim (same event, same object, same numbers) and list their numbers in "relevant". Be strict: an article that checks a DIFFERENT claim on a similar topic (for example a different banknote, an old video about the same mission, a different scheme) is NOT relevant. If none match, return an empty list.
Then judge the message. Use "fake" if a relevant article shows the claim is false, misleading or fabricated; "real" only if a relevant article clearly confirms it. If no article is relevant, judge as you normally would.
${VERDICT_RULES}
Only if "relevant" is not empty, say in the reasons what those fact-checkers found. Never claim that fact-checkers confirmed or denied anything unless a relevant article says so. Reply ONLY with the JSON object.
${msgBlock(text, fromOcr)}`;
  const body = JSON.stringify({contents:[{role:"user",parts:partsFor(prompt)}],
    generationConfig:{temperature:0.1, responseMimeType:"application/json",
      responseSchema: schema({relevant:{type:"ARRAY",items:{type:"INTEGER"}}})}});
  return maybeEscalate(body, await callGemini(body));
}

/* ============================ FACT-CHECK SEARCH ======================= */
function decodeHtml(s){ const d=document.createElement("textarea"); d.innerHTML=String(s||"").replace(/<[^>]+>/g," "); return d.value.replace(/\s+/g," ").trim(); }
const STOP = new Set("the a an of in on to for and or is are was were be by with from this that it its as at new news viral claim claims fake true india indian government govt says said video photo image message whatsapp".split(" "));
const words = s => (s.toLowerCase().match(/[\p{L}\p{N}]+/gu)||[]).filter(w=>w.length>=3 && !STOP.has(w));
async function searchFactChecks(queries){
  const jobs=[];
  for(const q of queries.slice(0,2)) for(const site of FACTCHECK_SITES){
    const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(), 5000);
    jobs.push(fetch(`https://${site}/wp-json/wp/v2/posts?search=${encodeURIComponent(q)}&per_page=4&_fields=title,link,date,excerpt`,{signal:ctl.signal})
      .then(r=>r.ok?r.json():[]).then(list=>(Array.isArray(list)?list:[]).map(p=>({q, site:site.replace(/^www\./,""), title:decodeHtml(p.title&&p.title.rendered),
        link:p.link, date:String(p.date||"").slice(0,10), excerpt:decodeHtml(p.excerpt&&p.excerpt.rendered).slice(0,220)})))
      .catch(()=>[]).finally(()=>clearTimeout(t)));
  }
  const all=(await Promise.all(jobs)).flat().filter(a=>/^https:\/\//.test(a.link||"") && a.title);
  const seen=new Set(), out=[];
  for(const a of all){
    if(seen.has(a.link)) continue; seen.add(a.link);
    const qw=[...new Set(words(a.q))], tw=new Set(words(a.title+" "+a.excerpt));
    const hit=qw.filter(w=>tw.has(w)).length;
    a.score = qw.length ? hit/qw.length : 0;
    if(hit>=2 && a.score>=0.5) out.push(a);
  }
  return out.sort((x,y)=>y.score-x.score || (y.date>x.date?1:-1)).slice(0,6);
}
async function googleFactCheck(text){
  if(!FACTCHECK_API_KEY) return [];
  const q=text.replace(/https?:\/\/\S+/g," ").replace(/\s+/g," ").trim().slice(0,200); if(q.length<8) return [];
  const r=await fetch("https://factchecktools.googleapis.com/v1alpha1/claims:search?pageSize=5&query="+encodeURIComponent(q)+"&key="+encodeURIComponent(FACTCHECK_API_KEY));
  if(!r.ok) return []; const j=await r.json(); const out=[];
  for(const c of (j.claims||[])) for(const rv of (c.claimReview||[]))
    out.push({title:(rv.title||c.text||"")+" — "+(rv.textualRating||""), site:(rv.publisher&&(rv.publisher.site||rv.publisher.name))||"", link:rv.url, date:(rv.reviewDate||"").slice(0,10), excerpt:""});
  return out.filter(a=>/^https?:/.test(a.link||"")).slice(0,3);
}

/* ============================ PIPELINE ================================ */
function status(t){ $("checkStatus").textContent = t||""; }
async function check(){
  stopSpeak();
  if(ocrBusy) return;
  const text = $("msg").value.trim();
  if(!text && !imageData){ alert(L().empty); $("msg").focus(); return; }
  const fromOcr = !!text && text === filledFromOcr;
  const btn=$("checkBtn"); btn.disabled=true; status(L().checking);
  const res = {lang, rules:ruleCheck(text), greet:isGreeting(text), noText:!text, ai:null, sources:[], errors:[], t0:performance.now()};
  try{
    if(res.rules.score < 3 && !res.greet && hasKey()){   // greetings need no AI call
      try{
        res.ai = await aiCheck(text, fromOcr);
        const qs = (res.ai.search_queries||[]).filter(q=>q && q.trim().length>3);
        // Fact-check sites mostly publish debunks, so only search when the first answer is "unsure" or "fake".
        if((res.ai.verdict==="unsure" || res.ai.verdict==="fake") && qs.length){
          status(L().searching);
          const arts = (await googleFactCheck(text).catch(()=>[])).concat(await searchFactChecks(qs));
          res.trace = {found:arts.length};
          if(arts.length){
            status(L().checking);
            try{
              const r2 = await aiRecheck(text, fromOcr, arts);
              const rel = [...new Set(r2.relevant||[])].map(n=>arts[n-1]).filter(Boolean);
              res.trace = {found:arts.length, relevant:rel.length, second:r2.verdict};
              res.sources = rel.slice(0,3);                     // show only articles about this exact claim
              // unsure → may become fake/real/unsure with evidence; fake → can only stay fake (gains sourced reasons)
              if(rel.length && (res.ai.verdict==="unsure" || r2.verdict==="fake")) res.ai = Object.assign(r2, {checkedSources:true});
              else if(res.ai.verdict==="fake" && r2.verdict!=="fake") res.sources = [];
            }catch(e){ res.trace = {found:arts.length, secondError:e.code||String(e)}; }
          }
        }
      }catch(e){ res.errors.push(e.code||"aiErr"); }
    }else if(res.rules.score < 3 && FACTCHECK_API_KEY && text){
      res.sources = await googleFactCheck(text).catch(()=>[]);
    }
  }finally{
    res.ms = Math.round(performance.now()-res.t0);
    res.verdict = decide(res);
    lastResult = res; renderResult(res);
    btn.disabled=false; status("");
    $("result").scrollIntoView({behavior:"smooth",block:"start"});
  }
}
function decide(res){
  const sc=res.rules.score, ai=res.ai;
  if(sc>=3) return "fake";
  if(ai){
    if(ai.verdict==="fake") return "fake";
    if(ai.verdict==="real" && sc<=1) return "real";      // a plain link or "tonight" doesn't block real news
    if(ai.verdict==="no_claim" && sc<=1) return "none";
    return "unsure";
  }
  if(res.greet && sc===0) return "none";
  return "unsure";
}

const TIPLINES = [["BOOM","+91 77009 06588"],["Factly","+91 92470 52470"],["Vishvas News","+91 92052 70923"],
  ["The Quint WebQoof","+91 95405 11818"],["PIB Fact Check","+91 87997 11259",true]];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function aiReason(res){
  const a=res.ai; if(!a) return "";
  if(lang==="en") return a.reason_en; if(lang==="hi") return a.reason_hi||a.reason_en;
  return (res.lang===lang && a.reason_local) ? a.reason_local : a.reason_en;
}
function reasonLines(res){
  const s=L(), lines=[];
  if(res.verdict==="fake" || res.verdict==="unsure")
    for(const id of res.rules.ids.filter(id=>id!=="urgent" || res.verdict==="fake").slice(0,2)) if(s["r_"+id]) lines.push(s["r_"+id]);
  const r=aiReason(res); if(r) lines.push(s.aiSays+": "+r);
  if(!lines.length) lines.push(res.verdict==="none" ? s.greetReason : (res.noText ? s.noTextReason : s.noSigns));
  for(const e of res.errors) lines.push(s[e]||s.aiErr);
  return lines.slice(0,3);
}
const ICON = {fake:"❌", real:"✅", unsure:"⚠️", none:"💬"};
function renderResult(res){
  const s=L(), v=res.verdict, box=$("result");
  box.className=v; box.style.display="block";
  $("vIcon").textContent = ICON[v]; $("vText").textContent = s[v];
  $("reasons").innerHTML = reasonLines(res).map(l=>"<li>"+esc(l)+"</li>").join("");
  $("sources").innerHTML = res.sources.length ? "<strong>"+esc(s.srcTitle)+"</strong>"+res.sources.map(a=>
    `<a href="${esc(a.link)}" target="_blank" rel="noopener noreferrer">🔗 ${esc(a.title)} <span style="font-weight:400">(${esc(a.site)}${a.date?", "+esc(a.date):""})</span></a>`).join("") : "";
  $("tiplines").hidden = v!=="unsure";
  $("tipList").innerHTML = TIPLINES.map(([n,num,pib])=>`<li>${esc(n)}${pib?" ("+esc(s.pibNote)+")":""}: <a href="https://wa.me/${num.replace(/\D/g,"")}" target="_blank" rel="noopener noreferrer">${esc(num)}</a></li>`).join("");
  $("waBtn").hidden = v==="none";
  $("t_wa").textContent=s.wa; $("t_speak").textContent=speaking?s.stop:s.speak; $("voiceNote").hidden=true;
}

/* ============================ SHARE / SPEAK =========================== */
function pageLink(){ return /^https?:/.test(location.href) ? location.href.split(/[?#]/)[0] : ""; }
$("waBtn").onclick = () => {
  if(!lastResult) return; const s=L(), v=lastResult.verdict;
  const head = v==="fake"?s.waFake : v==="real"?s.waReal : s.waUnsure;
  const src = lastResult.sources[0] ? "\n🔗 "+lastResult.sources[0].link : "";
  const msg = `${head}\n${ICON[v]} ${s[v]}\n• ${reasonLines(lastResult)[0]}${src}\n\n${s.waEnd} ${pageLink()}`.trim();
  window.open("https://wa.me/?text="+encodeURIComponent(msg), "_blank", "noopener");
};
let speaking=false;
function stopSpeak(){ if("speechSynthesis" in window) speechSynthesis.cancel(); speaking=false; if(lastResult) $("t_speak").textContent=L().speak; }
$("speakBtn").onclick = () => {
  if(!("speechSynthesis" in window) || !lastResult) return;
  if(speaking){ stopSpeak(); return; }
  const s=L(), code=LANGS[lang].tts, vs=speechSynthesis.getVoices();
  const voice = vs.find(x=>x.lang.replace("_","-")===code) || vs.find(x=>x.lang.toLowerCase().startsWith(lang));
  if(vs.length && !voice && lang!=="en" && lang!=="hi"){ $("voiceNote").textContent=s.noVoice; $("voiceNote").hidden=false; return; }
  const u=new SpeechSynthesisUtterance(s[lastResult.verdict]+". "+reasonLines(lastResult).join(". "));
  u.lang=code; u.rate=0.9; if(voice) u.voice=voice;
  u.onend=u.onerror=()=>{speaking=false; $("t_speak").textContent=L().speak;};
  speechSynthesis.speak(u); speaking=true; $("t_speak").textContent=s.stop;
};
$("clearBtn").onclick = () => {
  stopSpeak(); ocrJob++; ocrBusy=false; $("checkBtn").disabled=false;
  $("msg").value=""; ocrText=""; filledFromOcr=""; imageData=null; lastResult=null;
  $("preview").style.display="none"; $("progress").style.display="none"; $("result").style.display="none"; status("");
  window.scrollTo({top:0,behavior:"smooth"}); $("msg").focus();
};
$("checkBtn").onclick = check;
